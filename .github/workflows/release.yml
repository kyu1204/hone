name: release
# A release is the merge of a pull request from `release/vX.Y.Z` (package.json and CHANGELOG already at X.Y.Z).
# The merge runs the checks, compiles the binaries, publishes to npm and creates tag vX.Y.Z with the GitHub Release.
# Run it by hand with an existing tag to finish a release that stopped halfway; every step skips what is already done.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.1.0"
        required: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/v') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.event.pull_request.merge_commit_sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: the tag is the branch name and must match package.json
        id: v
        env:
          REF: ${{ inputs.tag || github.event.pull_request.head.ref }}
        run: |
          TAG="${REF#release/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun scripts/release-check.ts "${{ steps.v.outputs.tag }}"
  binaries:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [bun-linux-x64, bun-linux-x64-musl, bun-linux-arm64, bun-darwin-x64, bun-darwin-arm64, bun-windows-x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-binaries.ts --only ${{ matrix.target }} --out dist/bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/bin/hone-*
          if-no-files-found: error
  publish:
    needs: [check, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC); no NPM_TOKEN secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: publish, unless this version is on npm already
        run: |
          V="$(node -p 'require("./package.json").version')"
          if npm view "hone-eval@$V" version >/dev/null 2>&1; then echo "hone-eval@$V is on npm already"; else npm publish --provenance --access public; fi
  release:
    needs: [check, binaries, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: collect binaries and checksums
        run: |
          mkdir -p dist/bin
          find artifacts -type f -name 'hone-*' -exec cp {} dist/bin/ \;
          (cd dist/bin && sha256sum hone-* > SHA256SUMS && cat SHA256SUMS)
      - name: tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" dist/bin/* --clobber
          else gh release create "$TAG" dist/bin/* --target "$SHA" --title "hone $TAG" --generate-notes --latest; fi
